<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff-Social Profile</title>
    <link href="../css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <nav class="navigation">
        <ul>
          <li><a href="../login-register/login.html">login</a></li>
          <li><a href="../login-register/register.html">register</a></li>
          <li><a href="../index.html">feed</a></li>
          <li><a href="#">profile</a></li>
      </nav>
    </header>
    <main>
      <h1>Profile</h1>
      <div id="newPostWindowEdit" class="hidden">
        <div id="newPostContainerEdit">
          <h2>edit post:</h2>
          <label for="newPostTitleEdit">title*</label>
          <input
            type="text"
            name="newPostTitleEdit"
            id="newPostTitleEdit"
            title="Write the title of your post"
            required
          />
          <label for="newPostBodyEdit">body</label>
          <textarea id="newPostBodyEdit"></textarea>
          <label for="newPostSubmitEdit" class="hidden">submit post</label>
          <input
            type="submit"
            name="newPostSubmitEdit"
            id="newPostSubmitEdit"
            value="post"
          />
          <input
            type="button"
            id="dismissPostButtonEdit"
            name="dismissPostButton"
            value="X"
          />
        </div>
      </div>
      <div class="hidden" id="editOrDeletePrompt">
        <p>Do you want to edit or delete this post?</p>
        <button id="toEdit">edit post</button>
        <button id="toDelete">delete post</button>
        <button id="toDismiss">X</button>
      </div>
      <section id="profileSection">
        <article id="userProfile">
        </article>
      </section>
    </main>
    <script type="module" src="../src/profile.js"></script>
  </body>
</html>
