<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff-Social Feed</title>
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <nav class="navigation">
        <ul>
          <li><a href="./login-register/login.html">login</a></li>
          <li><a href="./login-register/register.html">register</a></li>
          <li><a href="#">feed</a></li>
          <li><a href="./profile/index.html">profile</a></li>
          <li><a href="./profiles/index.html">all users</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Feed</h1>
      <label for="searchbar">search</label>
      <input
        type="text"
        id="searchbar"
        name="searchbar"
        placeholder="search posts"
      />
      <div id="newPostWindow" class="hidden">
        <div id="newPostContainer">
          <h2>create new post:</h2>
          <label for="newPostTitle">title*</label>
          <input
            type="text"
            name="newPostTitle"
            id="newPostTitle"
            title="Write the title of your post"
            required
          />
          <label for="newPostBody">body</label>
          <textarea id="newPostBody"></textarea>
          <label for="newPostSubmit" class="hidden">submit post</label>
          <input
            type="submit"
            name="newPostSubmit"
            id="newPostSubmit"
            value="post"
          />
          <input
            type="button"
            id="dismissPostButton"
            name="dismissPostButton"
            value="X"
          />
        </div>
      </div>
      <section id="feedContainer"></section>
      <div id="buttonContainerFeed">
        <button id="firstButton">first</button>
        <button id="prevButton">prev</button>
        <button id="nextButton">next</button>
        <button id="lastButton">last</button>
        <button id="newPostButton">new post</button>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
